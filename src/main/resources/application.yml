spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:notifications}
    username: ${DB_USER:notifications}
    password: ${DB_PASSWORD:notifications}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      concurrency: 2

server:
  port: ${PORT:8082}

app:
  topics:
    donations: maoamiga.donations.v1
    partitions: 2
  auth:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    issuer: ${AUTH_ISSUER:mao-amiga-api}
  push:
    expo-enabled: ${PUSH_EXPO_ENABLED:false}
    expo-url: https://exp.host/--/api/v2/push/send
    timeout: 5s
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8081,http://localhost:19006}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
